<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zenith Web Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top right, #1a1a2e, #0a0a0f);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-header {
            margin-bottom: 24px;
            text-align: center;
        }
        .app-header h1 {
            margin: 0;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        .app-header p {
            color: #94a3b8;
            margin-top: 8px;
        }
        .main-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            gap: 24px;
            flex-wrap: wrap;
        }
        .panel {
            flex: 1;
            min-width: 300px;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
        }
        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            color: #38bdf8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #zenith-ui-root {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
            width: 100%;
        }
        .zenith-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            padding: 16px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 12px;
            background: rgba(0, 242, 254, 0.05);
        }
        .zenith-row {
            display: flex;
            flex-direction: row;
            gap: 16px;
            align-items: center;
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(240, 70, 250, 0.3);
            border-radius: 8px;
            background: rgba(240, 70, 250, 0.05);
        }
        .zenith-text {
            font-size: 1rem;
            line-height: 1.5;
        }
        .terminal-panel {
            background: #090d16;
            border: 1px solid #1e293b;
        }
        .terminal-body {
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: #10b981;
            white-space: pre-wrap;
            overflow-y: auto;
            height: 350px;
            padding: 12px;
            background: #020617;
            border-radius: 8px;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8);
        }
        .interactive-btn {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .interactive-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>
    <div class="app-header">
        <h1>Zenith Live Web Target</h1>
        <p>Statically compiled Zenith layout engine & LLM bindings running live in browser</p>
    </div>
    <div class="main-container">
        <div class="panel">
            <div class="panel-title">
                Render Canvas
                <button class="interactive-btn" onclick="triggerIncrement()">setState Trigger</button>
            </div>
            <div id="zenith-ui-root"></div>
        </div>
        <div class="panel terminal-panel">
            <div class="panel-title" style="color: #10b981;">Output Console</div>
            <div class="terminal-body" id="zenith-console"></div>
        </div>
    </div>

    <script>
        const zenith = {
            consoleElement: null,
            print: function(msg) {
                if (!this.consoleElement) this.consoleElement = document.getElementById('zenith-console');
                this.consoleElement.textContent += msg;
                this.consoleElement.scrollTop = this.consoleElement.scrollHeight;
            },
            println: function(msg) {
                this.print(msg + '\n');
            },
            llmPrompt: async function(url, promptStr) {
                this.println('\n[Runtime] LLMClient sending prompt to local backend (' + url + '): "' + promptStr + '"');
                try {
                    const response = await fetch(url + '/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: 'llama3',
                            prompt: promptStr,
                            stream: false
                        })
                    });
                    if (response.ok) {
                        const json = await response.json();
                        return json.response;
                    }
                } catch(e) {}
                this.println('[Runtime Warning] Ollama backend not reachable. Falling back to simulated completion.');
                return "- Zenith compiles UI declarations straight to native bindings.\n" +
                       "- LLM prompts are statically validated at compile-time.\n" +
                       "- Zero runtime latency wrapper on top of pure C++ loops.";
            }
        };

        const UI = {
            print: function(msg) { zenith.print(Array.isArray(msg) ? msg.join('') : msg); },
            println: function(msg) { zenith.println(Array.isArray(msg) ? msg.join('') : msg); },
            Column: function(children, attrs = {}) {
                const el = document.createElement('div');
                el.className = 'zenith-column';
                for (const child of children) {
                    if (child) el.appendChild(child);
                }
                el.render = function() {
                    UI.render(el);
                    return el;
                };
                return el;
            },
            Row: function(children, attrs = {}) {
                const el = document.createElement('div');
                el.className = 'zenith-row';
                for (const child of children) {
                    if (child) el.appendChild(child);
                }
                el.render = function() {
                    UI.render(el);
                    return el;
                };
                return el;
            },
            Text: function(text, attrs = {}) {
                const el = document.createElement('span');
                el.className = 'zenith-text';
                el.textContent = Array.isArray(text) ? text.join('') : text;
                if (attrs.fontWeight === 'bold') {
                    el.style.fontWeight = 'bold';
                }
                el.render = function() {
                    UI.render(el);
                    return el;
                };
                return el;
            },
            render: function(element) {
                const root = document.getElementById('zenith-ui-root');
                root.innerHTML = '';
                root.appendChild(element);
            }
        };
    </script>
    <script>
function getVerificationStatus() {
    return " [Status: Verified (Custom import)]";
}
class CounterApp {
    constructor() {
        this.count = 0;
    }
    build() {
        return UI.Column([UI.Text(["Counter Value: " + this.count], {})], {});
    }
    increment() {
        this.setState(() => {
            this.count = this.count + 1;
        });
    }
    render() {
        const newDom = this.build();
        if (this.domElement && this.domElement.parentNode) {
            this.domElement.parentNode.replaceChild(newDom, this.domElement);
        } else {
            const root = document.getElementById('zenith-ui-root');
            root.innerHTML = '';
            root.appendChild(newDom);
        }
        this.domElement = newDom;
        return newDom;
    }
}
class Circle {
    constructor(radius) {
        this.radius = radius;
    }
    getArea() {
        return 3.14159 * this.radius * this.radius;
    }
}
class Database {
    constructor(url) {
        this.url = url;
    }
    async summarizeDocument(text) {
    }
}
async function ChatScreen() {
    let active_users = ["Jay", "Alex"];
    let scores = {"Jay": 100, "Alex": 95};
    let active = true;
    let retry = 0;
    active_users.push("Sam");
    if (active == true) {
        while (retry < 3) {
            retry = retry + 1;
        }
    }
    let db = new Database("http://localhost:11434");
    let response = await db.summarizeDocument("This is a document payload.");
    return UI.Column([UI.Text(["AI Summary:"], {fontWeight: "bold"}), UI.Row([UI.Text([response], {}), UI.Text([getVerificationStatus()], {})], {})], {});
}
async function main() {
    UI.println(["--- Booting Zenith App ---"], {});
    let app = await ChatScreen();
    app.render();
    UI.println(["\n--- Testing Counter App setState ---"], {});
    let counter = new CounterApp();
    counter.build().render();
    counter.increment();
    counter.increment();
    UI.println(["\n--- Testing Interface Polymorphism ---"], {});
    let my_shape = new Circle(10.0);
    UI.println(["Circle Area: " + my_shape.getArea()], {});
    UI.println(["--- Zenith App Shutdown ---"], {});
}
        let counterGlobalInstance = null;
        function triggerIncrement() {
            if (counterGlobalInstance) {
                counterGlobalInstance.increment();
            }
        }

        // Hook CounterApp initialization to set the global trigger
        const originalCounterApp = CounterApp;
        CounterApp = class extends originalCounterApp {
            constructor(...args) {
                super(...args);
                counterGlobalInstance = this;
            }
        };

        window.onload = () => {
            main();
        };
    </script>
</body>
</html>
