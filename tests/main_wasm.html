<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zenith WASM Target</title>
    <style>
        body {
            background: #090d16;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            margin-bottom: 24px;
            text-align: center;
        }
        .header h1 {
            color: #38bdf8;
            font-size: 2rem;
            margin: 0 0 8px 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .header p {
            color: #94a3b8;
            margin: 0;
            font-size: 0.95rem;
        }
        .container {
            display: flex;
            gap: 24px;
            width: 100%;
            max-width: 1200px;
            height: 600px;
        }
        .card {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .card h3 {
            color: #38bdf8;
            margin-top: 0;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.1);
            padding-bottom: 8px;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        #app-root {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #020617;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            color: #e2e8f0;
        }
        #console {
            flex: 1;
            background: #020617;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            font-family: monospace;
            font-size: 0.85rem;
            color: #a7f3d0;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .log-item {
            margin-bottom: 6px;
            line-height: 1.4;
        }
        .log-system { color: #64748b; }
        .log-wasm { color: #f472b6; }
        .log-event { color: #fbbf24; }
    </style>
    <!-- WABT.js to compile .wat to .wasm natively in browser -->
    <script src="https://cdn.jsdelivr.net/gh/AssemblyScript/wabt.js/index.js"></script>
</head>
<body>
    <div class="header">
        <h1>Zenith WebAssembly Engine</h1>
        <p>Statically compiled Zenith application running inside WebAssembly sandbox</p>
    </div>
    <div class="container">
        <div class="card">
            <h3>Live Application</h3>
            <div id="app-root"></div>
        </div>
        <div id="console"></div>
    </div>
    <script>
        function logToConsole(msg, type = 'system') {
            const consoleEl = document.getElementById('console');
            if (consoleEl) {
                const item = document.createElement('div');
                item.className = 'log-item log-' + type;
                item.innerHTML = msg;
                consoleEl.appendChild(item);
                consoleEl.scrollTop = consoleEl.scrollHeight;
            }
        }
        let wasmMemory;
        let wasmInstance;
        function readString(ptr) {
            if (!wasmMemory) return 'null';
            const bytes = new Uint8Array(wasmMemory.buffer);
            let str = '';
            while (bytes[ptr] !== 0) {
                str += String.fromCharCode(bytes[ptr]);
                ptr++;
            }
            return str;
        }
        
        const DOMNodes = [null]; // Index 0 is null
        const InstanceDOM = {}; // Map of class instance pointer -> DOM element
        const importObject = {
            env: {
                print: (ptr) => logToConsole(`[WASM print]: ${readString(ptr)}`, 'wasm'),
                println: (ptr) => logToConsole(`[WASM println]: ${readString(ptr)}`, 'wasm'),
                create_column: () => {
                    const el = document.createElement('div');
                    el.style.display = 'flex'; el.style.flexDirection = 'column';
                    el.style.border = '1px solid rgba(56, 189, 248, 0.3)'; el.style.padding = '15px'; el.style.margin = '5px';
                    el.style.borderRadius = '10px';
                    el.style.background = 'rgba(56, 189, 248, 0.05)';
                    DOMNodes.push(el); return DOMNodes.length - 1;
                },
                create_row: () => {
                    const el = document.createElement('div');
                    el.style.display = 'flex'; el.style.flexDirection = 'row'; el.style.gap = '10px';
                    DOMNodes.push(el); return DOMNodes.length - 1;
                },
                create_text: (ptr) => {
                    const el = document.createElement('span');
                    el.textContent = readString(ptr);
                    DOMNodes.push(el); return DOMNodes.length - 1;
                },
                append_child: (parentIdx, childIdx) => {
                    if (DOMNodes[parentIdx] && DOMNodes[childIdx]) {
                        DOMNodes[parentIdx].appendChild(DOMNodes[childIdx]);
                    }
                },
                render: (instancePtr, nodeIdx) => {
                    if (DOMNodes[nodeIdx]) {
                        if (instancePtr && InstanceDOM[instancePtr]) {
                            // Replace old node with new node
                            const oldNode = InstanceDOM[instancePtr];
                            if (oldNode.parentNode) {
                                oldNode.parentNode.replaceChild(DOMNodes[nodeIdx], oldNode);
                            }
                            InstanceDOM[instancePtr] = DOMNodes[nodeIdx];
                            logToConsole('<i>[Runtime] setState: Re-rendering UI Layout...</i>', 'system');
                        } else {
                            const appRoot = document.getElementById('app-root');
                            appRoot.innerHTML = '';
                            appRoot.appendChild(DOMNodes[nodeIdx]);
                            if (instancePtr) {
                                InstanceDOM[instancePtr] = DOMNodes[nodeIdx];
                            }
                            logToConsole('<i>-- UI Component Successfully Rendered to DOM --</i>', 'system');
                        }
                    }
                },
                push: (val) => {},
                summarizeDocument: (ptr) => { logToConsole(`[Agentic] mock summarizeDocument: ${readString(ptr)}`, 'wasm'); return ptr; },
                concat_int: (strPtr, val) => {
                    const prefix = readString(strPtr);
                    const result = prefix + val;
                    const bytes = new Uint8Array(wasmMemory.buffer);
                    let ptr = 4096;
                    for (let i = 0; i < result.length; i++) {
                        bytes[ptr + i] = result.charCodeAt(i);
                    }
                    bytes[ptr + result.length] = 0;
                    return ptr;
                },
                concat_float: (strPtr, val) => {
                    const prefix = readString(strPtr);
                    let strVal = val.toString();
                    if (strVal.includes('.')) {
                        const parts = strVal.split('.');
                        if (parts[1].length > 6) strVal = val.toFixed(6);
                    }
                    const result = prefix + strVal;
                    const bytes = new Uint8Array(wasmMemory.buffer);
                    let ptr = 6144;
                    for (let i = 0; i < result.length; i++) {
                        bytes[ptr + i] = result.charCodeAt(i);
                    }
                    bytes[ptr + result.length] = 0;
                    return ptr;
                },
                create_button: (textPtr, instancePtr, methodPtr) => {
                    const label = readString(textPtr);
                    const methodName = readString(methodPtr);
                    const el = document.createElement('button');
                    el.textContent = label;
                    el.style.padding = '8px 16px';
                    el.style.margin = '5px';
                    el.style.border = 'none';
                    el.style.borderRadius = '6px';
                    el.style.background = '#38bdf8';
                    el.style.color = '#0f172a';
                    el.style.fontWeight = 'bold';
                    el.style.cursor = 'pointer';
                    el.style.transition = 'all 0.2s';
                    el.onmouseover = () => { el.style.background = '#0ea5e9'; };
                    el.onmouseout = () => { el.style.background = '#38bdf8'; };
                    el.onclick = () => {
                        if (wasmInstance && wasmInstance.exports[methodName]) {
                            logToConsole(`[Event] Button Clicked: calling ${methodName}(instancePtr: ${instancePtr})`, 'event');
                            wasmInstance.exports[methodName](instancePtr);
                        } else {
                            logToConsole(`[Event Error] Exported method not found: ${methodName}`, 'system');
                        }
                    };
                    DOMNodes.push(el);
                    return DOMNodes.length - 1;
                }
            }
        };

        async function loadWasm() {
            try {
                // Fetch the generated .wat file dynamically based on page name
                const watName = window.location.pathname.split('/').pop().replace('_wasm.html', '.wat') || 'main.wat';
                const response = await fetch(watName + '?t=' + Date.now());
                const watCode = await response.text();
                
                // Init WABT and parse the .wat to .wasm
                const wabt = await WabtModule();
                const wasmModule = wabt.parseWat(watName, watCode);
                const { buffer } = wasmModule.toBinary({});
                
                // Instantiate the WebAssembly module
                const { instance } = await WebAssembly.instantiate(buffer, importObject);
                wasmInstance = instance;
                wasmMemory = instance.exports.memory;
                logToConsole('-- WASM Module Booted --', 'system');
                
                // Call the main function if it exists
                if (instance.exports.main) {
                    const result = instance.exports.main();
                    logToConsole(`Main returned: ${result}`, 'system');
                }
            } catch (err) {
                logToConsole(`<span style="color:#f87171">WASM Error: ${err.message}</span>`, 'system');
            }
        }
        loadWasm();
    </script>
</body>
</html>
