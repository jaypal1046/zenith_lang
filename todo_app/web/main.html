    <script>
        // Helper to copy JS string to WASM memory
        function writeWasmString(instance, str) {
            const encoder = new TextEncoder();
            const bytes = encoder.encode(str + "\0");
            const allocFn = instance.exports.alloc || instance.exports.malloc;
            if (!allocFn) {
                console.error("WASM module does not export alloc/malloc!");
                return 0;
            }
            const ptr = allocFn(bytes.length);
            const mem = new Uint8Array(instance.exports.memory.buffer);
            mem.set(bytes, ptr);
            return ptr;
        }

        // Helper to read JS string from WASM memory
        function readWasmString(instance, ptr) {
            if (ptr === 0) return "";
            const mem = new Uint8Array(instance.exports.memory.buffer);
            let end = ptr;
            while (mem[end] !== 0) end++;
            const bytes = mem.slice(ptr, end);
            const decoder = new TextDecoder();
            const str = decoder.decode(bytes);
            const freeFn = instance.exports.dealloc || instance.exports.free;
            if (freeFn) freeFn(ptr, bytes.length + 1);
            return str;
        }

        // Generic wrapper for WASM functions taking/returning strings
        function callWasmStringToString(instance, fnName, ...args) {
            const fn = instance.exports[fnName];
            if (!fn) {
                console.error('WASM function not found: ' + fnName);
                return "";
            }
            const ptrs = args.map(arg => typeof arg === 'string' ? writeWasmString(instance, arg) : arg);
            const retPtr = fn(...ptrs);
            const result = readWasmString(instance, retPtr);
            const freeFn = instance.exports.dealloc || instance.exports.free;
            if (freeFn) {
                ptrs.forEach((ptr, i) => {
                    if (typeof args[i] === 'string') {
                        freeFn(ptr, new TextEncoder().encode(args[i]).length + 1);
                    }
                });
            }
            return result;
        }

        const wasmPromises = [];

        async function loadRawWasm(url, exportsToGlobal) {
            try {
                const response = await fetch(url);
                const bytes = await response.arrayBuffer();
                const results = await WebAssembly.instantiate(bytes, { env: {
                    abort: () => { console.error('abort called'); }
                }});
                const instance = results.instance;
                for (const fnName of exportsToGlobal) {
                    window[fnName] = function(...args) {
                        return callWasmStringToString(instance, fnName, ...args);
                    };
                }
                console.log('[WASM] Raw WASM module loaded from ' + url);
            } catch (err) {
                console.error('[WASM Error] Failed to load ' + url + ': ' + err);
            }
        }

        async function loadDartWasm(wasmUrl, mjsUrl, exportsToGlobal) {
            try {
                const module = await import(mjsUrl);
                const dartInstance = await module.instantiate(fetch(wasmUrl));
                for (const fnName of exportsToGlobal) {
                    if (dartInstance[fnName]) {
                        window[fnName] = dartInstance[fnName];
                    } else if (dartInstance.exports && dartInstance.exports[fnName]) {
                        window[fnName] = dartInstance.exports[fnName];
                    } else {
                        window[fnName] = dartInstance[fnName];
                    }
                }
                console.log('[WASM] Dart WASM module loaded from ' + wasmUrl);
            } catch (err) {
                console.warn('[WASM Warning] Failed to load Dart WASM via JS module, trying raw loader: ' + err);
                await loadRawWasm(wasmUrl, exportsToGlobal);
            }
        }

    </script>

    <script>
        // Platform Detection Constants
        const isAndroid = false;
        const isIos = false;
        const isMac = false;
        const isLinux = false;
        const isWeb = true;
        const isWindows = false;

        const zenith = {
            consoleElement: null,
            print: function(msg) {
                if (!this.consoleElement) this.consoleElement = document.getElementById('zenith-console');
                if (this.consoleElement) {
                    this.consoleElement.textContent += msg;
                    this.consoleElement.scrollTop = this.consoleElement.scrollHeight;
                }
                console.log(msg);
            },
            println: function(msg) {
                this.print(msg + '\n');
            },
            encodeImageToBase64: async function(pathOrUrl) {
                if (!pathOrUrl) return "";
                if (pathOrUrl.startsWith("data:")) return pathOrUrl.split(",")[1];
                try {
                    const response = await fetch(pathOrUrl);
                    const blob = await response.blob();
                    return new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            const base64String = reader.result.split(',')[1];
                            resolve(base64String);
                        };
                        reader.readAsDataURL(blob);
                    });
                } catch (e) {
                    return "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==";
                }
            },
            llmPrompt: async function(url, promptStr, isStreaming, imagePath) {
                let imageBase64 = "";
                if (imagePath) {
                    this.println('[Runtime] Loading and encoding image: ' + imagePath);
                    imageBase64 = await this.encodeImageToBase64(imagePath);
                }
                this.println('\n[Runtime] LLMClient sending prompt to local backend (' + url + '): "' + promptStr + '"');
                if (imageBase64) {
                    this.println('[Runtime] Image attached (Base64 length: ' + imageBase64.length + ' chars)');
                }
                try {
                    const response = await fetch(url + '/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: 'llama3',
                            prompt: promptStr,
                            stream: !!isStreaming,
                            images: imageBase64 ? [imageBase64] : undefined
                        })
                    });
                    if (response.ok) {
                        if (isStreaming) {
                            const reader = response.body.getReader();
                            const decoder = new TextDecoder("utf-8");
                            let buffer = "";
                            let fullResponse = "";
                            while (true) {
                                const { value, done } = await reader.read();
                                if (done) break;
                                buffer += decoder.decode(value, { stream: true });
                                const lines = buffer.split("\n");
                                buffer = lines.pop();
                                for (const line of lines) {
                                    if (line.trim() === "") continue;
                                    try {
                                        const json = JSON.parse(line);
                                        if (json.response) {
                                            fullResponse += json.response;
                                            this.print(json.response);
                                        }
                                    } catch (err) {}
                                }
                            }
                            if (buffer.trim() !== "") {
                                try {
                                    const json = JSON.parse(buffer);
                                    if (json.response) {
                                        fullResponse += json.response;
                                        this.print(json.response);
                                    }
                                } catch (err) {}
                            }
                            this.println("");
                            return fullResponse;
                        } else {
                            const json = await response.json();
                            return json.response;
                        }
                    }
                } catch(e) {}
                this.println('[Runtime Warning] Ollama backend not reachable. Falling back to simulated completion.');
                let simulated = "Simulated response for prompt: '" + promptStr + "'";
                if (imageBase64) {
                    simulated += " with image '" + imagePath + "'";
                }
                if (isStreaming) {
                    const tokens = simulated.split(" ");
                    let fullText = "";
                    for (const tok of tokens) {
                        this.print(tok + " ");
                        await new Promise(r => setTimeout(r, 50));
                        fullText += tok + " ";
                    }
                    this.println("");
                    return fullText;
                } else {
                    return simulated;
                }
            }
        };

        async function httpGet(url) {
            zenith.println('[Network] httpGet: Fetching ' + url + '...');
            try {
                const response = await fetch(url);
                if (response.ok) {
                    return await response.text();
                }
            } catch(e) {}
            zenith.println('[Network Error/CORS] Using mock response for ' + url);
            if (url.includes('users')) {
                return JSON.stringify({users: ["Sam", "Jay", "Alex"], status: "active"});
            }
            return JSON.stringify({message: "Hello from Zenith JS mock endpoint!", status: "success"});
        }

        async function httpPost(url, body) {
            zenith.println('[Network] httpPost: Posting to ' + url + '...');
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: body
                });
                if (response.ok) {
                    return await response.text();
                }
            } catch(e) {}
            zenith.println('[Network Error/CORS] Using mock response for POST ' + url);
            return JSON.stringify({status: "posted", received: JSON.parse(body)});
        }

            applyStyles: function(el, attrs = {}) {

                if (attrs.fontWeight) el.style.fontWeight = attrs.fontWeight;

                }
                if (attrs.onChange && typeof attrs.onChange === 'function') {
                    el.oninput = function() { attrs.onChange(el.value); };

            },
            Column: function(children, attrs = {}) {

                if (attrs.value !== undefined) el.value = attrs.value;

            Toggle: function(label, attrs = {}) {
                const wrapper = document.createElement('label');
                wrapper.style.display = 'flex';
                wrapper.style.alignItems = 'center';
                wrapper.style.gap = '10px';
                wrapper.style.cursor = 'pointer';
                wrapper.style.margin = '5px';
                const switchDiv = document.createElement('div');
                switchDiv.style.position = 'relative';
                switchDiv.style.width = '44px';

                switchDiv.style.backgroundColor = '#475569';
                switchDiv.style.borderRadius = '12px';
                switchDiv.style.transition = 'background-color 0.2s';
                const knob = document.createElement('div');
                knob.style.position = 'absolute';

                knob.style.borderRadius = '50%';
                knob.style.backgroundColor = '#ffffff';
                knob.style.transition = 'transform 0.2s';
                switchDiv.appendChild(knob);
                let isOn = !!attrs.isOn;
                const updateToggleUI = (state) => {
                    isOn = state;
                    if (isOn) {
                        switchDiv.style.backgroundColor = '#10b981';
                        knob.style.transform = 'translateX(20px)';
                    } else {
                        switchDiv.style.backgroundColor = '#475569';
                        knob.style.transform = 'translateX(0)';

                };
                updateToggleUI(isOn);
                wrapper.onclick = (e) => {
                    e.preventDefault();
                    updateToggleUI(!isOn);

                        attrs.onChange(isOn);

                el.style.color = '#f8fafc';

                const populateOptions = (str) => {
                    el.innerHTML = '';
                    const opts = str.split(',');
                    for (const opt of opts) {
                        const trimmed = opt.trim();
                        if (!trimmed) continue;
                        const optionEl = document.createElement('option');
                        optionEl.value = trimmed;
                        optionEl.textContent = trimmed;
                        el.appendChild(optionEl);
                    }
                };
                const optsStr = Array.isArray(options) ? options.join(',') : (options || attrs.options || "");
                populateOptions(optsStr);
                if (attrs.value) el.value = attrs.value;
                UI.applyStyles(el, attrs);
                if (attrs.onChange && typeof attrs.onChange === 'function') {
