[package]
name = "zenith_native"
version = "0.1.0"
edition = "2021"
authors = ["Zenith Team"]
description = "Native Rust library for Zenith programming language"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "zenith_native"

[dependencies]
jni = { version = "0.21", optional = true }
android_logger = { version = "0.13", optional = true }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
android = ["jni", "android_logger"]
desktop = []

[profile.release]
opt-level = 3
lto = true
strip = true

# Android NDK build configuration
[target.aarch64-linux-android]
rustflags = ["-C", "link-arg=-landroid"]

[target.armv7-linux-androideabi]
rustflags = ["-C", "link-arg=-landroid"]

[build-dependencies]
cc = "1.0"
