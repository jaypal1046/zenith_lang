<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zenith Web Application</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at top right, #1a1a2e, #0a0a0f);
            color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .app-header {
            margin-bottom: 24px;
            text-align: center;
        }
        .app-header h1 {
            margin: 0;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        .app-header p {
            color: #94a3b8;
            margin-top: 8px;
        }
        .main-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            gap: 24px;
            flex-wrap: wrap;
        }
        .panel {
            flex: 1;
            min-width: 300px;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            display: flex;
            flex-direction: column;
        }
        .panel-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
            color: #38bdf8;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #zenith-ui-root {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
            width: 100%;
        }
        .zenith-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            padding: 16px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 12px;
            background: rgba(0, 242, 254, 0.05);
        }
        .zenith-row {
            display: flex;
            flex-direction: row;
            gap: 16px;
            align-items: center;
            width: 100%;
            padding: 12px;
            border: 1px solid rgba(240, 70, 250, 0.3);
            border-radius: 8px;
            background: rgba(240, 70, 250, 0.05);
        }
        .zenith-text {
            font-size: 1rem;
            line-height: 1.5;
        }
        .terminal-panel {
            background: #090d16;
            border: 1px solid #1e293b;
        }
        .terminal-body {
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            color: #10b981;
            white-space: pre-wrap;
            overflow-y: auto;
            height: 350px;
            padding: 12px;
            background: #020617;
            border-radius: 8px;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8);
        }
        .zenith-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 8px;
            padding: 8px 12px;
            color: #f8fafc;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .zenith-input:focus {
            border-color: #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
            background: rgba(15, 23, 42, 0.8);
        }
        .interactive-btn {
            background: linear-gradient(135deg, #059669, #10b981);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .interactive-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>
    <div class="app-header">
        <h1>Zenith Live Web Target</h1>
        <p>Statically compiled Zenith layout engine & LLM bindings running live in browser</p>
    </div>
    <div class="main-container">
        <div class="panel">
            <div class="panel-title">
                Render Canvas
                <button class="interactive-btn" onclick="triggerIncrement()">setState Trigger</button>
            </div>
            <div id="zenith-ui-root"></div>
        </div>
        <div class="panel terminal-panel">
            <div class="panel-title" style="color: #10b981;">Output Console</div>
            <div class="terminal-body" id="zenith-console"></div>
        </div>
    </div>

    <script>
        const zenith = {
            consoleElement: null,
            print: function(msg) {
                if (!this.consoleElement) this.consoleElement = document.getElementById('zenith-console');
                this.consoleElement.textContent += msg;
                this.consoleElement.scrollTop = this.consoleElement.scrollHeight;
            },
            println: function(msg) {
                this.print(msg + '\n');
            },
            llmPrompt: async function(url, promptStr) {
                this.println('\n[Runtime] LLMClient sending prompt to local backend (' + url + '): "' + promptStr + '"');
                try {
                    const response = await fetch(url + '/api/generate', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: 'llama3',
                            prompt: promptStr,
                            stream: false
                        })
                    });
                    if (response.ok) {
                        const json = await response.json();
                        return json.response;
                    }
                } catch(e) {}
                this.println('[Runtime Warning] Ollama backend not reachable. Falling back to simulated completion.');
                return "- Zenith compiles UI declarations straight to native bindings.\n" +
                       "- LLM prompts are statically validated at compile-time.\n" +
                       "- Zero runtime latency wrapper on top of pure C++ loops.";
            }
        };

        async function httpGet(url) {
            zenith.println('[Network] httpGet: Fetching ' + url + '...');
            try {
                const response = await fetch(url);
                if (response.ok) {
                    return await response.text();
                }
            } catch(e) {}
            zenith.println('[Network Error/CORS] Using mock response for ' + url);
            if (url.includes('users')) {
                return JSON.stringify({users: ["Sam", "Jay", "Alex"], status: "active"});
            }
            return JSON.stringify({message: "Hello from Zenith JS mock endpoint!", status: "success"});
        }

        async function httpPost(url, body) {
            zenith.println('[Network] httpPost: Posting to ' + url + '...');
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: body
                });
                if (response.ok) {
                    return await response.text();
                }
            } catch(e) {}
            zenith.println('[Network Error/CORS] Using mock response for POST ' + url);
            return JSON.stringify({status: "posted", received: JSON.parse(body)});
        }

        const UI = {
            print: function(msg) { zenith.print(Array.isArray(msg) ? msg.join('') : msg); },
            println: function(msg) { zenith.println(Array.isArray(msg) ? msg.join('') : msg); },
            applyStyles: function(el, attrs = {}) {
                if (!attrs) return;
                if (attrs.color) el.style.color = attrs.color;
                if (attrs.backgroundColor) el.style.backgroundColor = attrs.backgroundColor;
                if (attrs.padding) el.style.padding = typeof attrs.padding === 'number' ? attrs.padding + 'px' : attrs.padding;
                if (attrs.margin) el.style.margin = typeof attrs.margin === 'number' ? attrs.margin + 'px' : attrs.margin;
                if (attrs.width) el.style.width = typeof attrs.width === 'number' ? attrs.width + 'px' : attrs.width;
                if (attrs.height) el.style.height = typeof attrs.height === 'number' ? attrs.height + 'px' : attrs.height;
                if (attrs.fontWeight) el.style.fontWeight = attrs.fontWeight;
                if (attrs.flexDirection) el.style.flexDirection = attrs.flexDirection;
                if (attrs.justifyContent) el.style.justifyContent = attrs.justifyContent;
                if (attrs.alignItems) el.style.alignItems = attrs.alignItems;
                if (attrs.flexGrow !== undefined) el.style.flexGrow = attrs.flexGrow;
                if (attrs.gap) el.style.gap = typeof attrs.gap === 'number' ? attrs.gap + 'px' : attrs.gap;
                if (attrs.onClick && typeof attrs.onClick === 'function') {
                    el.onclick = attrs.onClick;
                }
                if (attrs.onChange && typeof attrs.onChange === 'function') {
                    el.oninput = function() { attrs.onChange(el.value); };
                }
            },
            Column: function(children, attrs = {}) {
                const el = document.createElement('div');
                el.className = 'zenith-column';
                const flatChildren = Array.isArray(children) ? children.flat() : [];
                for (const child of flatChildren) {
                    if (child) el.appendChild(child);
                }
                UI.applyStyles(el, attrs);
                el.render = function() {
                    UI.render(el);
                    return el;
                };
                return el;
            },
            Row: function(children, attrs = {}) {
                const el = document.createElement('div');
                el.className = 'zenith-row';
                const flatChildren = Array.isArray(children) ? children.flat() : [];
                for (const child of flatChildren) {
                    if (child) el.appendChild(child);
                }
                UI.applyStyles(el, attrs);
                el.render = function() {
                    UI.render(el);
                    return el;
                };
                return el;
            },
            Text: function(text, attrs = {}) {
                const el = document.createElement('span');
                el.className = 'zenith-text';
                el.textContent = Array.isArray(text) ? text.join('') : text;
                UI.applyStyles(el, attrs);
                el.render = function() {
                    UI.render(el);
                    return el;
                };
                return el;
            },
            Button: function(label, attrs = {}) {
                const el = document.createElement('button');
                el.className = 'interactive-btn';
                el.textContent = Array.isArray(label) ? label.join('') : label;
                UI.applyStyles(el, attrs);
                el.render = function() {
                    UI.render(el);
                    return el;
                };
                return el;
            },
            TextField: function(placeholder, attrs = {}) {
                const el = document.createElement('input');
                el.type = 'text';
                el.placeholder = Array.isArray(placeholder) ? placeholder.join('') : placeholder;
                el.className = 'zenith-input';
                if (attrs.value) el.value = attrs.value;
                UI.applyStyles(el, attrs);
                el.render = function() {
                    UI.render(el);
                    return el;
                };
                return el;
            },
            Image: function(url, attrs = {}) {
                const el = document.createElement('img');
                el.src = Array.isArray(url) ? url.join('') : url;
                el.style.maxWidth = '100%';
                el.style.borderRadius = '12px';
                el.style.boxShadow = '0 8px 30px rgba(0, 0, 0, 0.5)';
                el.style.border = '1px solid rgba(255, 255, 255, 0.1)';
                UI.applyStyles(el, attrs);
                el.render = function() {
                    UI.render(el);
                    return el;
                };
                return el;
            },
            Video: function(url, attrs = {}) {
                const el = document.createElement('video');
                el.src = Array.isArray(url) ? url.join('') : url;
                el.controls = true;
                el.style.maxWidth = '100%';
                el.style.borderRadius = '12px';
                el.style.boxShadow = '0 8px 30px rgba(0, 0, 0, 0.5)';
                el.style.border = '1px solid rgba(255, 255, 255, 0.1)';
                UI.applyStyles(el, attrs);
                el.render = function() {
                    UI.render(el);
                    return el;
                };
                return el;
            },
            Scrolling: function(children, attrs = {}) {
                const el = document.createElement('div');
                el.style.display = 'flex';
                el.style.flexDirection = 'column';
                el.style.overflowY = 'auto';
                el.style.maxHeight = '300px';
                el.style.border = '1px solid rgba(255, 255, 255, 0.1)';
                el.style.padding = '12px';
                el.style.borderRadius = '12px';
                el.style.background = 'rgba(0, 0, 0, 0.3)';
                const flatChildren = Array.isArray(children) ? children.flat() : [];
                for (const child of flatChildren) {
                    if (child) el.appendChild(child);
                }
                UI.applyStyles(el, attrs);
                el.render = function() {
                    UI.render(el);
                    return el;
                };
                return el;
            },
            Card: function(children, attrs = {}) {
                const el = document.createElement('div');
                el.style.display = 'flex';
                el.style.flexDirection = 'column';
                el.style.background = 'rgba(30, 41, 59, 0.6)';
                el.style.backdropFilter = 'blur(12px)';
                el.style.border = '1px solid rgba(255, 255, 255, 0.1)';
                el.style.borderRadius = '16px';
                el.style.padding = '20px';
                el.style.margin = '10px 0';
                el.style.boxShadow = '0 20px 40px rgba(0, 0, 0, 0.4)';
                const flatChildren = Array.isArray(children) ? children.flat() : [];
                for (const child of flatChildren) {
                    if (child) el.appendChild(child);
                }
                UI.applyStyles(el, attrs);
                el.render = function() {
                    UI.render(el);
                    return el;
                };
                return el;
            },
            Container: function(children, attrs = {}) {
                const el = document.createElement('div');
                el.style.display = 'flex';
                el.style.flexDirection = 'column';
                el.style.border = '1px solid rgba(255, 255, 255, 0.05)';
                el.style.borderRadius = '12px';
                el.style.padding = '16px';
                el.style.background = 'rgba(255, 255, 255, 0.02)';
                const flatChildren = Array.isArray(children) ? children.flat() : [];
                for (const child of flatChildren) {
                    if (child) el.appendChild(child);
                }
                UI.applyStyles(el, attrs);
                el.render = function() {
                    UI.render(el);
                    return el;
                };
                return el;
            },
            render: function(element) {
                const root = document.getElementById('zenith-ui-root');
                root.innerHTML = '';
                root.appendChild(element);
            }
        };
    </script>
    <script>
class GalleryApp {
    constructor() {
        this.title = "ZENITH PLATFORM GALLERY";
        this.loaded_data = "No API data fetched yet.";
        this.clicks = 0;
        counterGlobalInstance = this;
    }
    build() {
        return UI.Column([UI.Text([this.title], {fontWeight: "bold", color: "cyan"}), UI.Container([UI.Text(["1. Widget Grid & Flow Layouts"], {fontWeight: "bold", color: "yellow"}), UI.Row([UI.Text(["Flow item 1"], {color: "green"}), UI.Text(["Flow item 2"], {color: "magenta"})], {})], {padding: 1}), UI.Card([UI.Text(["2. Reactive Component States"], {fontWeight: "bold", color: "cyan"}), UI.Row([UI.Text(["Interactive clicks: " + this.clicks], {color: "green"}), UI.Button(["Click Me!"], {onClick: this.handlePress.bind(this)})], {})], {padding: 1}), UI.Row([UI.Image(["https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe"], {width: 35, height: 4}), UI.Video(["https://assets.mixkit.co/videos/preview/mixkit-stars-in-space-background-1611-large.mp4"], {width: 35, height: 4})], {}), UI.Scrolling([UI.Text(["Line 1: Infinite Scrolling Row"], {}), UI.Text(["Line 2: GPU Accelerated Layouts"], {}), UI.Text(["Line 3: Reactive State Binding"], {}), UI.Text(["Line 4: Native Platform Primitives"], {}), UI.Text(["Line 5: Dynamic CSS Variables"], {}), UI.Text(["Line 6: Single-Thread WASM Event Loop"], {})], {height: 4}), UI.Card([UI.Text(["3. REST API / Network Client Integration"], {fontWeight: "bold", color: "yellow"}), UI.Row([UI.Text(["Response: " + this.loaded_data], {}), UI.Button(["Fetch JSON"], {onClick: this.fetchData.bind(this)})], {})], {padding: 1}), UI.Card([UI.Text(["4. CSS Flexbox Layout Demonstration"], {fontWeight: "bold", color: "magenta"}), UI.Row([UI.Text(["[Grow 1]"], {color: "red", flexGrow: 1}), UI.Text(["[Grow 2]"], {color: "green", flexGrow: 2}), UI.Text(["[Grow 1]"], {color: "blue", flexGrow: 1})], {justifyContent: "space-around", gap: 1, width: 35})], {padding: 1})], {});
    }
    handlePress() {
        this.setState(() => {
            this.clicks = this.clicks + 1;
        });
    }
    async fetchData() {
        let res = await httpGet("https://jsonplaceholder.typicode.com/users");
        this.setState(() => {
            this.loaded_data = res;
        });
    }
    render() {
        const newDom = this.build();
        if (this.domElement && this.domElement.parentNode) {
            this.domElement.parentNode.replaceChild(newDom, this.domElement);
        } else {
            const root = document.getElementById('zenith-ui-root');
            root.innerHTML = '';
            root.appendChild(newDom);
        }
        this.domElement = newDom;
        return newDom;
    }
    setState(callback) {
        callback();
        this.render();
    }
}
async function main() {
    UI.println(["--- Booting Zenith Multi-Platform Gallery App ---"], {});
    let app = new GalleryApp();
    app.build().render();
    UI.println(["--- Gallery Loaded Successfully. Interactive loop started! ---"], {});
}
        let counterGlobalInstance = null;
        function triggerIncrement() {
            if (counterGlobalInstance) {
                if (typeof counterGlobalInstance.increment === 'function') {
                    counterGlobalInstance.increment();
                } else if (typeof counterGlobalInstance.handleIncrement === 'function') {
                    counterGlobalInstance.handleIncrement();
                }
            }
        }

        window.onload = () => {
            main();
        };
    </script>
</body>
</html>
